name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.305'
  SOLUTION: mealbot.sln
  CONFIGURATION: Release

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }} --configfile NuGet.config

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore --no-incremental

      - name: Test
        run: >-
          dotnet test ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  cd:
    name: Publish application
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }} --configfile NuGet.config

      - name: Publish worker
        run: >-
          dotnet publish src/MealBot.Bot/MealBot.Bot.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --output ./publish

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealbot-${{ github.sha }}
          path: publish
          if-no-files-found: error
